<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GRT Neural Lab</title>

<style>

/* ===== CORE ===== */
body{
margin:0;
font-family:Inter, sans-serif;
background:#02040a;
color:#fff;
overflow:hidden;
}

/* ===== BACKGROUND ===== */
#network{
position:fixed;
width:100%;
height:100%;
z-index:-2;
}

/* ===== CURSOR ===== */
.cursor{
position:fixed;
width:10px;
height:10px;
background:#00e5ff;
border-radius:50%;
pointer-events:none;
z-index:999;
box-shadow:0 0 20px #00e5ff;
}

/* ===== HEADER ===== */
.header{
display:flex;
align-items:center;
gap:10px;
padding:15px 20px;
backdrop-filter:blur(20px);
border-bottom:0.5px solid rgba(0,255,255,0.2);
}

.logo-ignite{
height:40px;
}

/* ===== HOLOGRAPHIC CORE ===== */
.core{
position:fixed;
right:40px;
bottom:40px;
width:90px;
height:90px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle,#00e5ff44,#000);
box-shadow:0 0 50px #00e5ff;
animation:rotateCore 6s linear infinite;
}

.core img{
width:60%;
}

@keyframes rotateCore{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* ===== PANELS ===== */
.panel{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(25px);
border:0.5px solid rgba(0,255,255,0.2);
border-radius:20px;
padding:20px;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:15px;
}

/* ===== BUTTON ===== */
.system-card{
padding:15px;
border-radius:15px;
background:rgba(255,255,255,0.05);
border:0.5px solid rgba(0,255,255,0.2);
cursor:pointer;
transition:0.3s;
}

.system-card:hover{
transform:scale(1.08);
box-shadow:0 0 15px #00e5ff;
}

/* ===== SCORE ===== */
.score{
font-size:40px;
text-align:center;
}

/* ===== CTA ===== */
.cta{
margin-top:30px;
text-align:center;
}

.cta button{
padding:12px 25px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#00e5ff,#7c5cff);
cursor:pointer;
}

/* ===== PRICING ===== */
.pricing{
margin-top:50px;
}

.card{
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.05);
border:0.5px solid rgba(0,255,255,0.2);
text-align:center;
}

</style>
</head>

<body>

<canvas id="network"></canvas>
<div class="cursor" id="cursor"></div>

<div class="core">
<img src="grt-logo-05.png">
</div>

<header class="header">
<img src="grt-logo-11.png" class="logo-ignite">
<span>Neural Intelligence Lab</span>
</header>

<section style="padding:20px">

<div class="panel">

<h2 id="contextText"></h2>

<div class="grid">

<button class="system-card decision" data-impact="15">Observability</button>
<button class="system-card decision" data-impact="-10">Speed</button>
<button class="system-card decision" data-impact="20">Fallbacks</button>

</div>

<div class="score" id="scoreValue">72</div>

<div class="panel" style="margin-top:20px">
<p id="stateText">Stable</p>
<p id="energyText">Medium</p>
<p id="impactText">Neutral</p>
</div>

</div>

<!-- 💰 FUNNEL -->
<div class="panel pricing">

<h2>Unlock Intelligence</h2>

<div class="grid">

<div class="card">
<h3>AI Audit</h3>
<p>$150</p>
<button>Unlock</button>
</div>

<div class="card">
<h3>System Design</h3>
<p>$500</p>
<button>Unlock</button>
</div>

<div class="card">
<h3>Enterprise</h3>
<p>Custom</p>
<button>Contact</button>
</div>

</div>

</div>

</section>

<script src="lab.js"></script>

</body>
</html>
