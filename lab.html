<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRT Neural Lab</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #01030a;
  --accent: #00e5ff;
  --purple: #7c5cff;
  --glass: rgba(255,255,255,0.05);
  --border: rgba(0,255,255,0.2);
}

body {
  margin: 0;
  font-family: 'Space Grotesk', sans-serif;
  background: radial-gradient(circle at center, #020617 0%, #000 100%);
  color: #fff;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */
#network {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -2;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px 25px;
  backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--border);
  background: rgba(0,0,0,0.4);
}
.logo-ignite {
  height: 40px;
}
.header span {
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--accent);
  text-shadow: 0 0 10px var(--accent);
}

/* ===== CORE ===== */
.core {
  position: fixed;
  right: 40px;
  bottom: 40px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle,#00e5ff44,#000);
  box-shadow: 0 0 60px var(--accent);
  animation: rotateCore 6s linear infinite;
}
.core img {
  width: 70%;
  filter: drop-shadow(0 0 15px var(--accent));
}
@keyframes rotateCore {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ===== PANEL ===== */
.panel {
  background: var(--glass);
  backdrop-filter: blur(25px);
  border: 0.5px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 25px rgba(0,255,255,0.15);
  transition: 0.3s;
}
.panel:hover {
  box-shadow: 0 0 35px rgba(0,255,255,0.3);
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
  gap: 15px;
}

/* ===== BUTTON ===== */
.system-card {
  padding: 15px;
  border-radius: 15px;
  background: var(--glass);
  border: 0.5px solid var(--border);
  cursor: pointer;
  transition: 0.3s;
  text-align: center;
  color: #fff;
}
.system-card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px var(--accent);
}

/* ===== SCORE ===== */
.score {
  font-size: 70px;
  text-align: center;
  margin-top: 20px;
  color: var(--accent);
  text-shadow: 0 0 25px var(--accent);
  font-weight: 600;
}

/* ===== STATUS ===== */
.status {
  display: flex;
  justify-content: space-around;
  margin-top: 20px;
  font-weight: 500;
  color: #ccc;
}

/* ===== PRICING ===== */
.pricing {
  margin-top: 50px;
}
.card {
  padding: 20px;
  border-radius: 20px;
  background: var(--glass);
  border: 0.5px solid var(--border);
  text-align: center;
  transition: 0.3s;
}
.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px var(--accent);
}
.card button {
  padding: 10px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(90deg,var(--accent),var(--purple));
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}
.card button:hover {
  transform: scale(1.1);
}

/* ===== CTA ===== */
.cta {
  text-align: center;
  margin-top: 30px;
}
</style>
</head>

<body>
<canvas id="network"></canvas>

<header class="header">
  <img src="grt-logo-11.png" class="logo-ignite">
  <span>Neural Intelligence Lab</span>
</header>

<section style="padding:20px">
  <div class="panel">
    <h2 style="text-align:center;color:#00e5ff;">Optimize the AI System for Reliability</h2>

    <div class="grid">
      <button class="system-card decision" data-impact="15">Observability</button>
      <button class="system-card decision" data-impact="-10">Speed</button>
      <button class="system-card decision" data-impact="20">Fallbacks</button>
    </div>

    <div class="score" id="scoreValue">72</div>

    <div class="status">
      <p id="stateText">Stable</p>
      <p id="energyText">Medium Energy</p>
      <p id="impactText">Neutral</p>
    </div>
  </div>

  <div class="panel pricing">
    <h2 style="color:#00e5ff;text-align:center;">Unlock Intelligence</h2>
    <div class="grid">
      <div class="card">
        <h3>AI Audit</h3>
        <p>$150</p>
        <button>Unlock</button>
      </div>
      <div class="card">
        <h3>System Design</h3>
        <p>$500</p>
        <button>Unlock</button>
      </div>
      <div class="card">
        <h3>Enterprise</h3>
        <p>Custom</p>
        <button>Contact</button>
      </div>
    </div>
  </div>
</section>

<div class="core">
  <img src="grt-logo-05.png">
</div>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
// === Particle Network ===
const canvas = document.getElementById('network');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const geometry = new THREE.BufferGeometry();
const vertices = [];
for (let i = 0; i < 800; i++) {
  vertices.push((Math.random() - 0.5) * 12);
  vertices.push((Math.random() - 0.5) * 12);
  vertices.push((Math.random() - 0.5) * 12);
}
geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
const material = new THREE.PointsMaterial({ color: 0x00e5ff, size: 0.04 });
const points = new THREE.Points(geometry, material);
scene.add(points);

function animate() {
  requestAnimationFrame(animate);
  points.rotation.x += 0.001;
  points.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();

// === Score Animation ===
const score = document.getElementById('scoreValue');
document.querySelectorAll('.decision').forEach(btn => {
  btn.addEventListener('click', () => {
    const impact = parseInt(btn.dataset.impact);
    const newScore = Math.max(0, parseInt(score.textContent) + impact);
    gsap.to(score, { textContent: newScore, duration: 0.8, snap: { textContent: 1 }, ease: "power2.out" });
    gsap.to(score, { scale: 1.2, yoyo: true, repeat: 1, duration: 0.3 });
