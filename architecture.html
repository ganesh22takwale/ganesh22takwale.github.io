<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRT Intelligence OS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0a0a1a;
--glass:rgba(255,255,255,0.05);
--border:rgba(255,255,255,0.08);
--accent:#6366f1;
--green:#22c55e;
--amber:#facc15;
--red:#ef4444;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:radial-gradient(circle at 30% 30%, #1e1b4b, transparent), var(--bg);
color:#e2e8f0;
overflow:hidden;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
border-bottom:1px solid var(--border);
background:rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
}
.header h3{
font-weight:700;
letter-spacing:1px;
color:#c7d2fe;
}
.live{
color:var(--green);
font-weight:500;
animation:pulse 1.5s infinite;
}
@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}

/* LAYOUT */
.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:var(--glass);
border:1px solid var(--border);
border-radius:12px;
padding:15px;
box-shadow:0 0 20px rgba(99,102,241,0.1);
transition:all 0.3s ease;
}
.card:hover{
box-shadow:0 0 25px rgba(99,102,241,0.3);
}

/* GRAPH */
canvas{
width:100%;
height:350px;
background:#020617;
border-radius:10px;
}

/* TRACE */
.trace{
height:200px;
overflow:auto;
font-family:monospace;
font-size:12px;
background:#0f172a;
padding:10px;
border-radius:8px;
}

/* AGENTS */
.agent{
padding:8px;
margin-bottom:6px;
border-radius:8px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
transition:background 0.3s ease;
}
.agent span{
font-weight:500;
}
.agent.active{background:rgba(34,197,94,0.2);}
.agent.processing{background:rgba(250,204,21,0.2);}
.agent.error{background:rgba(239,68,68,0.2);}

/* BUTTON */
button{
padding:10px 16px;
background:var(--accent);
border:none;
border-radius:6px;
color:white;
cursor:pointer;
font-weight:500;
transition:background 0.3s ease, transform 0.2s ease;
}
button:hover{
background:#818cf8;
transform:scale(1.05);
}

/* METRICS */
.metrics{
display:flex;
justify-content:space-around;
padding:10px 0;
font-size:13px;
color:#94a3b8;
}
.metrics span{
background:rgba(255,255,255,0.05);
padding:4px 8px;
border-radius:6px;
}

/* SCROLLBAR */
.trace::-webkit-scrollbar{
width:6px;
}
.trace::-webkit-scrollbar-thumb{
background:#6366f1;
border-radius:3px;
}
</style>
</head>

<body>

<div class="header">
<h3>GRT Intelligence OS</h3>
<div class="live">● Live System</div>
</div>

<div class="metrics">
<span>Latency: <b id="latency">0.00s</b></span>
<span>Throughput: <b id="throughput">100%</b></span>
<span>Reliability Index: <b id="reliability">0.999</b></span>
</div>

<div class="layout">

<!-- LEFT -->
<div>

<div class="card">
<h3>System Graph</h3>
<canvas id="graph"></canvas>
</div>

<div class="card">
<h3>Operational Log Stream</h3>
<div class="trace" id="trace"></div>
</div>

</div>

<!-- RIGHT -->
<div>

<div class="card">
<h3>Agents</h3>
<div class="agent" id="signal">Input Signal Processor <span>idle</span></div>
<div class="agent" id="reason">Cognitive Core <span>idle</span></div>
<div class="agent" id="exec">Action Synthesizer <span>idle</span></div>
</div>

<div class="card">
<h3>Control</h3>
<button onclick="run()">Initiate Intelligence Cycle</button>
</div>

</div>

</div>
